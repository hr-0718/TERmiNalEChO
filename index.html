<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101218;color:#eee;font:16px system-ui,sans-serif}
    /* The game picture lives in #hre-stage. The footer (license link, game items) is laid out
       by layoutPage(): in the side margins of a fixed-aspect picture when it fits there,
       otherwise as a band below the stage, so it never covers the picture. */
    #hre-stage{position:absolute;left:0;top:0;right:0;bottom:var(--hre-footer-band,0px)}
    canvas{width:100%;height:100%;display:block;object-fit:contain;outline:none}
    #hre-footer{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:12px;box-sizing:border-box;padding:6px 12px;color:#dbe8fa;font-size:12px;line-height:1.4;pointer-events:none}
    #hre-footer>*{pointer-events:auto;white-space:nowrap}#hre-footer a{color:inherit}
    body.hre-footer-empty #hre-footer{display:none}
    /* Start screen. Config/Web/Start.html may replace its content (#start, #status and #error
       are required; #progress and #hre-progress-detail are optional). While starting, the engine
       sets data-hre-phase, data-hre-progress and --hre-progress (0 to 1) on #loading. */
    #loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#101218;z-index:1}
    #panel{max-width:38rem;padding:2rem;text-align:center}h1{font-size:1.6rem}p{line-height:1.5;white-space:pre-wrap}
    button{border:0;border-radius:.4rem;background:#a4d0ff;color:#111;padding:.8rem 2rem;font:inherit;cursor:pointer}
    progress{width:100%;height:.6rem}#error{color:#ffb4b4}
    #save-status{position:absolute;bottom:calc(var(--hre-footer-band,0px) + 8px);left:12px;max-width:65%;color:#ffb4b4;font-size:13px;pointer-events:none;background:#101218cc}
  </style>
  <style>
@font-face{font-family:"TN Murecho";src:url(Files/Murecho-SemiBold-web.woff2) format("woff2");font-weight:400 900;font-display:swap}
/* TerNechoGame の起動ページ。エンジンの既定（WebPackage.index.html）の後に入る。
   起動前の画面の中身は Start.html、絵は Files/（_aiProject/game/tools/make_web_start.py で作る）。
   色はゲームの UI（TernechoUI.cpp の kCyan・kEmerald・kDim）に合わせる。 */
:root{--tn-navy:#040b14;--tn-cyan:#73f2ff;--tn-emerald:#4dffbf;--tn-dim:#bfd1e0;--tn-red:#ff8a80;
  --tn-sans:"TN Murecho","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",system-ui,sans-serif;
  --tn-mono:ui-monospace,"SFMono-Regular","Cascadia Mono",Consolas,"Roboto Mono",monospace}
html,body{background:var(--tn-navy)}
/* 起動前の画面の上にも、フッター（© とライセンス）を出す。帯の時は、その分だけ画面を詰める */
#hre-footer{z-index:2;color:#9fbccd}
#loading{bottom:var(--hre-footer-band,0px);background:var(--tn-navy)}

.tn-start{position:absolute;inset:0;overflow:hidden;color:#d8e8f2;font-family:var(--tn-sans);font-feature-settings:"palt";
  background:radial-gradient(ellipse 90% 60% at 50% 40%,#0c2536 0%,#071827 42%,#040b14 100%)}
.tn-grid{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(115,242,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(115,242,255,.06) 1px,transparent 1px);
  background-size:28px 28px;background-position:center;
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 42%,#000 20%,transparent 80%);mask-image:radial-gradient(ellipse 70% 55% at 50% 42%,#000 20%,transparent 80%)}
/* 四隅の目盛り。フッターを左右の余白に置く時は、下の角をフッターの上へずらす */
.tn-start::before,.tn-start::after{content:"";position:absolute;inset:10px;pointer-events:none;
  background:linear-gradient(var(--tn-cyan),var(--tn-cyan)) left top/18px 1px no-repeat,linear-gradient(var(--tn-cyan),var(--tn-cyan)) left top/1px 18px no-repeat,
    linear-gradient(var(--tn-cyan),var(--tn-cyan)) right top/18px 1px no-repeat,linear-gradient(var(--tn-cyan),var(--tn-cyan)) right top/1px 18px no-repeat,
    linear-gradient(var(--tn-cyan),var(--tn-cyan)) left bottom/18px 1px no-repeat,linear-gradient(var(--tn-cyan),var(--tn-cyan)) left bottom/1px 18px no-repeat,
    linear-gradient(var(--tn-cyan),var(--tn-cyan)) right bottom/18px 1px no-repeat,linear-gradient(var(--tn-cyan),var(--tn-cyan)) right bottom/1px 18px no-repeat;opacity:.45}
.tn-start::after{inset:10px 40px auto;height:6px;opacity:.22;
  background:repeating-linear-gradient(90deg,var(--tn-cyan) 0 1px,transparent 1px 12px)}

.tn-top{position:absolute;top:24px;left:24px;right:24px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  font:500 10px/1 var(--tn-mono);letter-spacing:.18em;color:rgba(115,242,255,.85)}
.tn-tag{display:inline-flex;align-items:center;gap:7px;padding:5px 8px;border:1px solid rgba(115,242,255,.3);background:rgba(4,20,30,.5);white-space:nowrap}
.tn-tag i{width:6px;height:6px;background:var(--tn-emerald);box-shadow:0 0 6px var(--tn-emerald)}
.tn-tag-sub{color:rgba(191,209,224,.55);border-color:rgba(191,209,224,.18)}

.tn-body{position:relative;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(14px,3.2vh,30px);padding:64px 24px 32px}
.tn-art{position:relative;width:min(64vw,36vh,300px);aspect-ratio:1;flex:none}
.tn-dial{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:tn-turn 80s linear infinite}
.tn-dial circle,.tn-dial path{fill:none;stroke:var(--tn-cyan)}
.tn-dial-ring{stroke-width:.6;opacity:.45}
.tn-dial-ticks{stroke-width:5;stroke-dasharray:.8 9.67;opacity:.28}
.tn-dial-inner{stroke-width:.5;stroke-dasharray:3 5;opacity:.3}
.tn-dial-cross{stroke-width:.8;opacity:.6}
.tn-cat{position:absolute;inset:15% 13% 11%;filter:drop-shadow(0 0 5px rgba(77,255,191,.5))}
.tn-cat>div{position:absolute;inset:0;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.tn-cat-fill{-webkit-mask-image:url(Files/teruneko-fill.png);mask-image:url(Files/teruneko-fill.png);
  background:repeating-linear-gradient(0deg,rgba(115,242,255,.16) 0 1px,transparent 1px 4px),linear-gradient(180deg,rgba(115,242,255,.24),rgba(77,255,191,.06))}
.tn-cat-line{-webkit-mask-image:url(Files/teruneko-line.png);mask-image:url(Files/teruneko-line.png);background:linear-gradient(180deg,var(--tn-cyan),var(--tn-emerald))}
.tn-scan{position:absolute;left:8%;right:8%;top:20%;height:1px;opacity:.7;
  background:linear-gradient(90deg,transparent,var(--tn-emerald),transparent);box-shadow:0 0 8px var(--tn-emerald);animation:tn-scan 3.6s ease-in-out infinite}

.tn-text{width:100%;max-width:32rem;text-align:center}
.tn-text p{margin:0;white-space:normal}
.tn-over{font:500 11px/1 var(--tn-mono);letter-spacing:.42em;color:rgba(77,255,191,.9);margin-bottom:10px!important}
.tn-title{margin:0;white-space:nowrap;font-size:clamp(21px,6.4vw,34px);line-height:1.2;font-weight:700;letter-spacing:.03em;color:#eef8ff;text-shadow:0 0 18px rgba(115,242,255,.25)}
.tn-title-ja{margin-left:.12em}
.tn-title small{font-size:.48em;font-weight:500;color:rgba(191,209,224,.7);margin-left:.15em;vertical-align:.25em}
.tn-lead{font-size:12px;letter-spacing:.24em;color:rgba(191,209,224,.66);margin:10px 0 clamp(18px,3.4vh,28px)!important}

.tn-button{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:210px;padding:14px 26px;border-radius:2px;
  border:1px solid rgba(115,242,255,.5);background:linear-gradient(180deg,rgba(18,70,84,.45),rgba(6,30,40,.55));color:#effdff;
  font:600 17px/1 var(--tn-sans);letter-spacing:.5em;text-indent:.5em;cursor:pointer;box-shadow:0 0 0 1px rgba(4,11,20,.6),0 0 18px rgba(77,255,191,.12);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.tn-button::before{content:"";position:absolute;inset:-6px;pointer-events:none;
  background:linear-gradient(var(--tn-emerald),var(--tn-emerald)) left top/10px 2px no-repeat,linear-gradient(var(--tn-emerald),var(--tn-emerald)) left top/2px 10px no-repeat,
    linear-gradient(var(--tn-emerald),var(--tn-emerald)) right top/10px 2px no-repeat,linear-gradient(var(--tn-emerald),var(--tn-emerald)) right top/2px 10px no-repeat,
    linear-gradient(var(--tn-emerald),var(--tn-emerald)) left bottom/10px 2px no-repeat,linear-gradient(var(--tn-emerald),var(--tn-emerald)) left bottom/2px 10px no-repeat,
    linear-gradient(var(--tn-emerald),var(--tn-emerald)) right bottom/10px 2px no-repeat,linear-gradient(var(--tn-emerald),var(--tn-emerald)) right bottom/2px 10px no-repeat}
.tn-button:hover,.tn-button:focus-visible{border-color:var(--tn-emerald);background:linear-gradient(180deg,rgba(40,120,110,.5),rgba(8,44,48,.6));box-shadow:0 0 0 1px rgba(4,11,20,.6),0 0 24px rgba(77,255,191,.35);outline:none}
.tn-button:active{transform:scale(.98)}
.tn-button:disabled{opacity:.55;cursor:default}
.tn-button[hidden]{display:none}
.tn-note{margin-top:14px!important;font-size:10.5px;line-height:1.5;color:rgba(191,209,224,.5)}
#loading:not([data-hre-phase="ready"]) .tn-note{display:none}

.tn-progress{width:min(300px,78vw);margin:0 auto}
#loading[data-hre-phase="ready"] .tn-progress{display:none}
.tn-progress-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:500 11px/1.4 var(--tn-mono);letter-spacing:.06em}
.tn-status{color:var(--tn-dim);text-align:left}
.tn-detail{color:var(--tn-cyan);font-variant-numeric:tabular-nums;white-space:nowrap}
.tn-bar{position:relative;height:2px;margin-top:9px;background:rgba(115,242,255,.14);overflow:visible}
.tn-bar::before{content:"";position:absolute;left:0;right:0;bottom:4px;height:4px;opacity:.35;background:repeating-linear-gradient(90deg,var(--tn-cyan) 0 1px,transparent 1px 10%)}
.tn-bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(var(--hre-progress,0));
  background:linear-gradient(90deg,var(--tn-cyan),var(--tn-emerald));box-shadow:0 0 8px rgba(77,255,191,.6);transition:transform .25s ease-out}
#loading:not([data-hre-progress]) .tn-bar i,#loading[data-hre-progress="unknown"] .tn-bar i{width:28%;transform:none;animation:tn-busy 1.3s ease-in-out infinite}
#loading[data-hre-phase="failed"] .tn-bar{display:none}
#loading[data-hre-phase="failed"] .tn-status{color:var(--tn-red)}
#loading[data-hre-phase="failed"] .tn-progress-row{justify-content:center}
.tn-error{margin-top:10px!important;color:var(--tn-red);font-size:12px;line-height:1.5;white-space:pre-wrap!important;word-break:break-word}
.tn-error:empty{display:none}

@keyframes tn-turn{to{transform:rotate(360deg)}}
@keyframes tn-scan{0%,100%{top:18%;opacity:0}10%,90%{opacity:.7}50%{top:86%}}
@keyframes tn-busy{0%{left:0}50%{left:72%}100%{left:0}}
@media (prefers-reduced-motion:reduce){.tn-dial,.tn-scan,.tn-bar i{animation:none!important}.tn-scan{display:none}}

/* 横長で背の低い画面（スマホの横）：絵と文字を横に並べる */
@media (orientation:landscape) and (max-height:560px){
  .tn-top{top:18px}
  .tn-body{flex-direction:row;gap:6vw;padding:52px 32px 20px}
  .tn-art{width:min(62vh,38vw,300px)}
  .tn-text{text-align:left;max-width:24rem}
  .tn-title{font-size:clamp(20px,6.4vh,30px)}
  .tn-lead{margin-bottom:16px!important}
  .tn-progress{margin:0}
}
body.hre-layout-margins:not(.hre-footer-empty) .tn-start::before{bottom:34px}
/* 狭い画面：札を小さく。とても狭い時は右の札を隠す */
@media (max-width:479px){.tn-top{left:20px;right:20px;font-size:9px;letter-spacing:.1em}.tn-tag{padding:4px 6px;gap:5px}}
@media (max-width:339px){.tn-tag-sub{display:none}}

  <div class="tn-body">

</div>
</section>
  <span id="save-status" role="status" aria-live="polite"></span>
  <script>
    'use strict';
    // Local, per-origin/project IndexedDB storage. No network requests are made here.
// Numeric result codes match File::UserSave::Code; completion is after syncfs(false).
function createHREUserStorage(module, projectId, notify) {
  'use strict';
  const OK=2, INVALID=3, MISSING=4, LARGE=5, DENIED=7, IO=8, SPACE=9, UNAVAILABLE=10, BUSY=11;
  const maxFile=16*1024*1024, maxQueue=32*1024*1024;
  const root='/save/game-'+encodeURIComponent(projectId), fs=module.FS;
  const lockName='HREngine.UserSave:'+root;
  let ready=false, pumping=false, busy=false, queuedBytes=0;
  const jobs=[];
  const sync=populate=>new Promise((resolve,reject)=>{
    let database, descriptor, ended=false, settled=false, failure;
    const transactions=new Set();
    const settle=()=>{
      if(settled || !ended || transactions.size) return;
      settled=true;clearTimeout(timer);
      if(database) {
        if(descriptor) Object.defineProperty(database,'transaction',descriptor);
        else delete database.transaction;
      }
      failure?reject(failure):resolve();
    };
    const finish=error=>{
      if(settled || ended) return;
      ended=true;failure=error;
      // IDBFS may call its error callback before the failed transaction aborts.
      // Wait for/cancel this operation's transactions before rollback can start.
      if(error) for(const tx of transactions) { try { tx.abort(); } catch {} }
      settle();
    };
    const timer=setTimeout(()=>{
      // An operation with unknown completion must never be followed by a write
      // from stale memory. Restart/restoration is required after this timeout.
      ready=false;
      for(const tx of transactions) {try{tx.abort();}catch{}}
      transactions.clear();
      finish(new DOMException('Local saved data storage timed out','TimeoutError'));settle();
    },30000);
    // Pinned IDBFS exposes getDB. Its onabort callback can receive a null error
    // for an explicit abort, so also observe the actual database abort event.
    module.IDBFS.getDB(root,(error,db)=>{
      if(settled) return;
      if(error) return finish(error);
      database=db;descriptor=Object.getOwnPropertyDescriptor(db,'transaction');
      const original=db.transaction;
      db.transaction=function(...args) {
        const tx=original.apply(this,args);
        transactions.add(tx);
        tx.addEventListener('complete',()=>{transactions.delete(tx);settle();},{once:true});
        tx.addEventListener('abort',()=>{
          transactions.delete(tx);
          finish(tx.error || new DOMException('Saved data transaction aborted','AbortError'));
          settle();
        },{once:true});
        return tx;
      };
      try { fs.syncfs(populate,finish); } catch(error) { finish(error); }
    });
  });
  const locked=work=>navigator.locks.request(lockName,{mode:'exclusive'},work);
  const errorCode=error=> {
    const name=error?.name || error?.target?.error?.name;
    if(name==='TimeoutError') return UNAVAILABLE;
    if(name==='QuotaExceededError' || error?.errno===51) return SPACE;
    if(name==='SecurityError' || name==='NotAllowedError' || error?.errno===2 || error?.errno===63) return DENIED;
    return IO;
  };
  function safeKey(key) {
    if(typeof key!=='string' || !key || new TextEncoder().encode(key).length>512) return null;
    key=key.replaceAll('\\','/');
    const parts=key.split('/');
    if(parts.length>16 || parts.some(p=>!p || p==='.' || p==='..' || /[\x00-\x1f\x7f:*?"<>|]/.test(p) || /[. ]$/.test(p) || new TextEncoder().encode(p).length>128 || /^(CON|PRN|AUX|NUL|COM[0-9¹²³]|LPT[0-9¹²³])(?:\.|$)/i.test(p))) return null;
    return key;
  }
  function path(key, create) {
    let current=root;
    const parts=key.split('/');
    for(let i=0;i<parts.length;++i) {
      current+='/'+parts[i];
      const exists=fs.analyzePath(current,true).exists;
      if(exists) {
        const stat=fs.lstat(current);
        if(fs.isLink(stat.mode) || (i+1<parts.length && !fs.isDir(stat.mode)) || (i+1===parts.length && !fs.isFile(stat.mode))) throw Object.assign(new Error('Unsafe save path'),{errno:2});
      } else if(create && i+1<parts.length) fs.mkdir(current);
    }
    return current;
  }
  async function execute(job) {
    if(!ready) return UNAVAILABLE;
    try {
      return await locked(async()=>{
        // Refresh under the same cross-tab lock before changing anything. An old
        // tab must not overwrite/delete saves committed by a newer tab.
        await sync(true);
        let changed=false;
        try {
          if(job.operation!==2) {
            changed=true; // Includes directory creation or a partially failed write.
            const target=path(job.key,job.operation===0);
            if(job.operation===1) {
              if(fs.analyzePath(target,true).exists) { fs.unlink(target); changed=true; }
            } else {
              // IDBFS compares timestamps. Ensure changes in the same millisecond
              // are not mistaken for an unchanged file, even across different tabs.
              const previous=fs.analyzePath(target,true).exists?Number(fs.stat(target).mtime):0;
              fs.writeFile(target,job.bytes);
              const timestamp=new Date(Math.max(Date.now(),previous+1));
              fs.utime(target,timestamp,timestamp); changed=true;
            }
          }
          await sync(false); // IDBFS invokes this callback from transaction.oncomplete.
          return OK;
        } catch(error) {
          // A failed IndexedDB transaction preserves its previous committed data.
          // Restore MEMFS before exposing reads or processing the next operation.
          if(changed && ready) {
            try { await sync(true); }
            catch(recovery) { ready=false; console.error('Could not restore local saved data:',recovery); }
          }
          throw error;
        }
      });
    } catch(error) { return errorCode(error); }
  }
  async function drain() {
    if(pumping) return;
    pumping=true;
    while(jobs.length) {
      const job=jobs.shift();
      busy=true;
      const code=await execute(job);
      queuedBytes-=job.bytes.length;
      // C++ callbacks may synchronously read or queue another save.
      busy=false;
      module._hre_complete_user_save(job.id,code);
      notify(code);
    }
    pumping=false;
  }
  return {
    async initialize() {
      module.hreSaveRoot=root;
      try {
        fs.mkdirTree(root); fs.mount(module.IDBFS,{},root);
        if(!navigator.locks?.request) throw new Error('Safe local saving requires the Web Locks API.');
        await locked(()=>sync(true));
        ready=true;
      } catch(error) {
        ready=false;
        console.warn('Local saved data is unavailable:',error);
        notify(UNAVAILABLE); // Play can continue, but do not overwrite unknown saved data.
      }
    },
    submit(id,key,bytes,operation) {
      const complete=code=>{ module._hre_complete_user_save(id,code);notify(code); };
      if(!ready) return complete(UNAVAILABLE);
      if(operation!==0 && operation!==1 && operation!==2) return complete(INVALID);
      const safe=operation===2?'':safeKey(key);
      if(operation!==2 && safe===null) return complete(INVALID);
      if(bytes.length>maxFile) return complete(LARGE);
      if(jobs.length>=64 || queuedBytes+bytes.length>maxQueue) return complete(BUSY);
      queuedBytes+=bytes.length;
      jobs.push({id,key:safe,bytes,operation});
      void drain();
    },
    read(key,pointer,capacity) {
      const copying=pointer!==0 || capacity===-1;
      if(!ready) return copying?UNAVAILABLE:-UNAVAILABLE;
      if(busy) return copying?BUSY:-BUSY;
      const safe=safeKey(key);
      if(safe===null) return copying?INVALID:-INVALID;
      try {
        const target=path(safe,false);
