    // Local, per-origin/project IndexedDB storage. No network requests are made here.
// Numeric result codes match File::UserSave::Code; completion is after syncfs(false).

      if(settled || !ended || transactions.size) return;
      settled=true;clearTimeout(timer);
      if(database) {
        if(descriptor) Object.defineProperty(database,'transaction',descriptor);
        else delete database.transaction;

    };

      if(settled || ended) return;
      ended=true;failure=error;
      // IDBFS may call its error callback before the failed transaction aborts.
      // Wait for/cancel this operation's transactions before rollback can start.
      if(error) for(const tx of transactions) { try { tx.abort(); } catch {} }
      settle();

      // from stale memory. Restart/restoration is required after this timeout.

    // for an explicit abort, so also observe the actual database abort event.

    submit(id,key,bytes,operation) {

      if(bytes.length>maxFile) return complete(LARGE);
      if(jobs.length>=64 || queuedBytes+bytes.length>maxQueue) return complete(BUSY);
      queuedBytes+=bytes.length;
      jobs.push({id,key:safe,bytes,operation});
      void drain();
    },
    read(key,pointer,capacity) {
      const copying=pointer!==0 || capacity===-1;
      if(!ready) return copying?UNAVAILABLE:-UNAVAILABLE;
      if(busy) return copying?BUSY:-BUSY;
      const safe=safeKey(key);
      if(safe===null) return copying?INVALID:-INVALID;
      try {
        const target=path(safe,false);
        if(!fs.analyzePath(target,true).exists) return copying?MISSING:-MISSING;
        const stat=fs.stat(target);
        if(stat.size>maxFile) return copying?LARGE:-LARGE;
        // The first call only asks for length; the second copies a stable snapshot.
        // Empty buffers have a null pointer too, so capacity=-1 denotes that copy.
        if(!pointer && capacity!==-1) return stat.size;
        const bytes=fs.readFile(target);
        if(bytes.length!==Math.max(0,capacity)) return IO;
        if(bytes.length) module.HEAPU8.set(bytes,pointer);
        return OK;
      } catch(error) { const code=errorCode(error);return pointer||capacity===-1?code:-code; }
    }
  };
}

    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
